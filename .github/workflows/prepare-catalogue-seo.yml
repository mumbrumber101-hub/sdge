name: Prepare approved catalogue SEO repair
on:
  push:
    branches: [seo-prepare-catalogue-20261112]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply exact validated patch
        env:
          EXPECTED_HEAD: cc3caad55e269ee339cc5e1d5a366fe7c69ea2fd
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PYTHON'
          import base64, hashlib, json, zlib
          from pathlib import Path
          p = Path('index.html')
          raw = p.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'a10ca3a779524ba501b2932f0b3cb02eba9bd9dfcec7745a5385e636112f0489'
          text = raw.decode('utf-8')
          replacements = json.loads(zlib.decompress(base64.b64decode('')))
          for before, after in replacements:
              assert text.count(before) == 1
              text = text.replace(before, after, 1)
          result = text.encode('utf-8')
          assert hashlib.sha256(result).hexdigest() == '2ef93f632f2f92eb12975c0cea7ae5b47dc65e7aec49424d3829af72de25ca19'
          p.write_bytes(result)
          print('Verified approved catalogue patch, 75 initial work families')
          PYTHON
          test "$(git diff --name-only)" = "index.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expose catalogue entries in initial HTML and add SEO metadata"
          git push origin HEAD:refs/heads/seo-candidate-catalogue-20261112
          git rev-parse HEAD
