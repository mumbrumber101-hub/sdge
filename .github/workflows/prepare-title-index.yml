name: Prepare complete catalogue title index
on:
  push:
    branches: [seo-prepare-title-index-20261112]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Apply reviewed title index
        env:
          EXPECTED_HEAD: 089dc04220abbec19b9227defec11fa50e09d8a6
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PYTHON'
          import base64, hashlib, json, zlib
          from pathlib import Path
          p = Path('index.html')
          raw = p.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '2ef93f632f2f92eb12975c0cea7ae5b47dc65e7aec49424d3829af72de25ca19'
          text = raw.decode('utf-8')
          payload = json.loads(zlib.decompress(base64.b64decode('')))
          for before, after in payload['changes']:
              assert text.count(before) == 1
              text = text.replace(before, after, 1)
          result = text.encode('utf-8')
          assert hashlib.sha256(result).hexdigest() == '92df67d08ab5f59e66725a0d473f6200ca0cd1c99ec1d76da31241b8b8453fa9'
          p.write_bytes(result)
          title = Path('titles.html')
          assert not title.exists()
          contents = payload['titles'].encode('utf-8')
          assert hashlib.sha256(contents).hexdigest() == '0a19bd235573c531c2c9247d37a599730d00c957fc0dafa4f66516c1a800631d'
          title.write_bytes(contents)
          print('Verified complete 408-title index and catalogue link')
          PYTHON
          test "$(git diff --name-only)" = "index.html"
          test "$(git ls-files --others --exclude-standard)" = "titles.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html titles.html
          git commit -m "Add readable alphabetical index of all 408 work families"
          git push origin HEAD:refs/heads/seo-candidate-title-index-20261112
          git rev-parse HEAD
